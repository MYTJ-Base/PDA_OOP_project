name: CMake Build and Publish

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Install
      run: cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/install --config ${{env.BUILD_TYPE}}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pda-oop-${{ matrix.os }}
        path: ${{github.workspace}}/install/bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare Release Assets
      run: |
        mkdir release
        # Move Linux build to a subfolder
        mv "artifacts/pda-oop-ubuntu-latest" "release/linux-version"
        # Move Windows build to a subfolder
        mv "artifacts/pda-oop-windows-latest" "release/windows-version"
        
        # Zip them up
        zip -r pda-oop-v${{ github.ref_name }}-ready-to-run.zip release/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: pda-oop-v${{ github.ref_name }}-ready-to-run.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
